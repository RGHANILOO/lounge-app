<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Warm Cream Rounded Background -->
  <rect width="512" height="512" rx="112" fill="#F8F4EB" />

  <!-- Cocktail Glass Bowl (Triangle) -->
  <polygon points="128,160 384,160 256,320" fill="#F0E8D8" stroke="#4A0E17" stroke-width="16" stroke-linejoin="round" />

  <!-- Liquid / Drink Fill (Terracotta Orange) -->
  <polygon points="160,200 352,200 256,310" fill="#D9431E" />

  <!-- Glass Stem & Base -->
  <path d="M256,320 L256,400 M200,400 L312,400" stroke="#4A0E17" stroke-width="16" stroke-linecap="round" />

  <!-- Striped Straw (Sage & Maroon) -->
  <line x1="320" y1="100" x2="220" y2="340" stroke="#6B8E7B" stroke-width="14" stroke-linecap="round" />

  <!-- Cocktail Olive / Garnish -->
  <circle cx="330" cy="110" r="24" fill="#6B8E7B" stroke="#4A0E17" stroke-width="8" />
</svg>
